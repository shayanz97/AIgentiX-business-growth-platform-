[project]
name = "aigentix"
version = "0.1.0"
description = "AIgentiX Growth Platform API, platform services, business modules and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "email-validator>=2.3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pwdlib[argon2]>=0.3",
    "structlog>=26.1",
    "anthropic>=2.6,<3",
    "beautifulsoup4>=4.13",
    "httpx2>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "mypy>=2.4",
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigentix"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT"]
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "E501"]
"migrations/**" = ["E501"]
# Typographic characters are intentional (prompt-delimiter neutralisation, quote normalisation).
"src/aigentix/modules/lead_intelligence/agents/text_safety.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aigentix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
