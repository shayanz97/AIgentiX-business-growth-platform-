# Local development / single-host stack. Copy .env.example to .env first.
name: aigentix

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:-aigentix}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aigentix}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  # Lead Intelligence research (see apps/api/.env.example)
  RESEARCH_FETCH_BACKEND: ${RESEARCH_FETCH_BACKEND:-internet}
  RESEARCH_MAX_PAGES: ${RESEARCH_MAX_PAGES:-8}
  RESEARCH_MAX_CONCURRENT_RUNS: ${RESEARCH_MAX_CONCURRENT_RUNS:-2}
  RESEARCH_IMPORT_MAX_ROWS: ${RESEARCH_IMPORT_MAX_ROWS:-100}
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_ROUTE_EXTRACTION: ${LLM_ROUTE_EXTRACTION:-}
  LLM_ROUTE_AUDIT: ${LLM_ROUTE_AUDIT:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_PRICES_JSON: ${LLM_PRICES_JSON:-}
  LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-claude-haiku-5-5}
  LLM_AUDIT_MODEL: ${LLM_AUDIT_MODEL:-claude-opus-5-5}
  LLM_MAX_COST_PER_RUN_USD: ${LLM_MAX_COST_PER_RUN_USD:-0.50}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aigentix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aigentix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations, then exits. api/worker start only after it succeeds.
  migrate:
    # The only service that builds the API image; api and worker reuse it. Several services building the same
    # tag race on export with BuildKit's containerd image store ("image ... already exists").
    build:
      context: apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    image: aigentix-api:dev
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: aigentix-api:dev
    pull_policy: never  # built by the migrate service; never look for it in a registry
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: aigentix-api:dev
    pull_policy: never  # built by the migrate service; never look for it in a registry
    command: ["python", "-m", "aigentix.worker"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # The image's default healthcheck probes the API port; the worker proves liveness by touching a file on
    # every loop iteration instead (stale after 60 s → unhealthy).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/aigentix-worker.heartbeat') < 60 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    image: aigentix-web:dev
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
